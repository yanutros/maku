# Tests de l'interface (Playwright, voir playwright.config.ts) : Maku en mode démo, sur ordinateur, téléviseur,
# téléphone et moteur de Safari. À chaque envoi sur main, et avant la construction des paquets d'une version
# (paquets.yml) : une version ne part pas avec un test cassé. En cas d'échec, le rapport (captures, traces) est
# joint à l'exécution.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface:
    name: Interface (Playwright)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Les numéros de version concordent (et valent l'étiquette, à la publication d'une version) ; chaque commande
      # appelée par l'interface existe côté Rust.
      - name: Versions et contrat entre l'interface et le Rust
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node scripts/check-version.mjs "$TAG"
          node --test tests/versions.test.mjs tests/contrat.test.mjs

      - name: Navigateurs (Chromium et WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Tests
        run: npx playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: rapport-tests
          path: playwright-report
          retention-days: 14

  serveur:
    name: Maku Server (cargo test)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tests du relais
        run: cargo test --locked

  # Le Rust de l'application (src-tauri) : commandes acceptées par mpv, redirections, jetons retirés des erreurs,
  # configuration, adresses des serveurs… Compilé pour Linux, comme le paquet.
  client:
    name: Application (cargo test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Dépendances système
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      # La page du téléphone intègre jsQR (node_modules), et Tauri veut le dossier de l'interface construite.
      - run: npm ci

      - run: mkdir -p dist

      - name: Tests de l'application
        working-directory: src-tauri
        run: cargo test --locked
