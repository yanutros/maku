# Maku Server (dossier server/) : image Docker du relais Seerr et Tracearr, publiée sur
# ghcr.io/yanutros/maku-server à chaque version (étiquettes « 0.17.0 » et « latest »), pour les
# ordinateurs et les serveurs ARM (Raspberry Pi, NAS).
name: Maku Server

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image Docker (amd64, arm64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # L'étiquette de l'image vient de server/Cargo.toml : si ce fichier a été oublié, la nouvelle version
      # écraserait l'image de la précédente.
      - name: Version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-version.mjs "$TAG"

      - name: Tests du relais
        working-directory: server
        run: cargo test --locked

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes
        id: tags
        run: |
          version=$(grep -m1 '^version' server/Cargo.toml | cut -d'"' -f2)
          echo "list=ghcr.io/yanutros/maku-server:${version},ghcr.io/yanutros/maku-server:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/yanutros/maku
            org.opencontainers.image.description=Relais Seerr et Tracearr pour Maku
            org.opencontainers.image.licenses=GPL-3.0-or-later
