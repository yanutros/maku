# Maku Server (dossier server/) : image Docker du relais Seerr et Tracearr, publiée sur
# ghcr.io/yanutros/maku-server à chaque version (étiquettes « 0.17.0 » et « latest »), pour les
# ordinateurs et les serveurs ARM (Raspberry Pi, NAS).
name: Maku Server

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image Docker (amd64, arm64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Tests du relais
        working-directory: server
        run: cargo test --locked

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes
        id: tags
        run: |
          version=$(grep -m1 '^version' server/Cargo.toml | cut -d'"' -f2)
          echo "list=ghcr.io/yanutros/maku-server:${version},ghcr.io/yanutros/maku-server:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/yanutros/maku
            org.opencontainers.image.description=Relais Seerr et Tracearr pour Maku
            org.opencontainers.image.licenses=GPL-3.0-or-later
