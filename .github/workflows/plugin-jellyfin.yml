# Plugin Maku pour Jellyfin (plugins/jellyfin) : compilé et testé à chaque modification. Un tag « jellyfin-v1.2.3 »
# publie la version dans le catalogue que Jellyfin consulte (Tableau de bord → Extensions → Dépôts) :
#   https://github.com/yanutros/maku/releases/download/jellyfin-plugin/manifest.json
# Le catalogue et les archives sont rangés dans une version GitHub à part, « jellyfin-plugin », jamais marquée comme la
# dernière : la mise à jour de l'application Maku n'en tient pas compte.
name: Plugin Jellyfin

on:
  push:
    branches: [main]
    paths: ["plugins/jellyfin/**", "docs/jellyfin/**", ".github/workflows/plugin-jellyfin.yml"]
    tags: ["jellyfin-v*"]
  pull_request:
    paths: ["plugins/jellyfin/**", "docs/jellyfin/**", ".github/workflows/plugin-jellyfin.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilation et tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test plugins/jellyfin/Jellyfin.Plugin.Maku.Tests

      # Le catalogue publié à chaque version (catalogue.mjs) : versions précédentes gardées, ancien catalogue illisible refusé.
      - name: Tests du catalogue
        run: node --test plugins/jellyfin/catalogue.test.mjs

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/jellyfin-v* ]]; then v="${GITHUB_REF#refs/tags/jellyfin-v}"; else v="0.0.0"; fi
          echo "version=$v.0" >> "$GITHUB_OUTPUT"

      - name: Compilation
        run: >
          dotnet build plugins/jellyfin/Jellyfin.Plugin.Maku -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}

      # L'archive : le plugin, sa description (version et date à jour) et son image.
      - name: Archive
        shell: bash
        run: |
          out=plugins/jellyfin/Jellyfin.Plugin.Maku/bin/Release/net10.0
          node -e '
            const fs = require("fs");
            const f = process.argv[1];
            const meta = JSON.parse(fs.readFileSync(f, "utf8"));
            meta.version = process.argv[2];
            meta.timestamp = new Date().toISOString();
            fs.writeFileSync(f, JSON.stringify(meta, null, 2));
          ' "$out/meta.json" "${{ steps.version.outputs.version }}"
          mkdir -p dist
          (cd "$out" && zip -j "$GITHUB_WORKSPACE/dist/maku-jellyfin_${{ steps.version.outputs.version }}.zip" Jellyfin.Plugin.Maku.dll meta.json maku.png)

      - uses: actions/upload-artifact@v7
        with:
          name: maku-jellyfin
          path: dist/*.zip
          retention-days: 14

  publish:
    name: Catalogue Jellyfin
    needs: build
    if: startsWith(github.ref, 'refs/tags/jellyfin-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: maku-jellyfin
          path: dist

      # La version « jellyfin-plugin » existe-t-elle ? Sinon, elle est créée (jamais « Latest »). Le catalogue déjà
      # publié est repris : s'il existe et ne se télécharge pas (panne du réseau), la publication s'arrête ici, au
      # lieu de le remplacer par un catalogue qui n'aurait plus que la nouvelle version.
      - name: Version GitHub du catalogue
        shell: bash
        run: |
          set -euo pipefail
          if gh release view jellyfin-plugin >/dev/null 2>&1; then
            assets=$(gh release view jellyfin-plugin --json assets --jq '.assets[].name')
          else
            gh release create jellyfin-plugin \
              --title "Plugin Maku pour Jellyfin" \
              --notes "Catalogue du plugin Maku pour Jellyfin. Dans Jellyfin : Tableau de bord → Extensions → Dépôts → ajouter https://github.com/yanutros/maku/releases/download/jellyfin-plugin/manifest.json" \
              --latest=false
            assets=""
          fi
          if grep -qx manifest.json <<<"$assets"; then
            gh release download jellyfin-plugin --pattern manifest.json --dir old
            test -s old/manifest.json
          else
            echo "Pas encore de catalogue : celui-ci sera le premier."
          fi

      # Le catalogue : la nouvelle version en tête, les précédentes gardées (somme MD5 de chaque archive). Un ancien
      # catalogue illisible arrête la publication (voir plugins/jellyfin/catalogue.mjs).
      - name: Catalogue
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls dist/*.zip)
          old=""
          if [ -f old/manifest.json ]; then old=old/manifest.json; fi
          node plugins/jellyfin/catalogue.mjs "$zip" "$GITHUB_REF_NAME" plugins/jellyfin/Jellyfin.Plugin.Maku/meta.json "$old" dist/manifest.json
          gh release upload jellyfin-plugin "$zip" dist/manifest.json --clobber
