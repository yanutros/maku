<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Maku</title>
<style>
  :root { color-scheme: dark; --accent: #e5a00d; --bg: #141518; --elev: #1d1f23; --dim: #a0a3ab; --ok: #46c08a; --err: #ef5d55; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: #f1f1f3; font: 16px/1.5 system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 440px; margin: 0 auto; padding: 32px 20px 48px; }
  .logo { width: 56px; height: 56px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(145deg, #f7bd3a, #e5a00d 55%, #c98400); color: #1a1300; box-shadow: 0 0 36px #e5a00d55; }
  h1 { margin: 0 0 6px; text-align: center; font-size: 24px; }
  .sub { margin: 0 0 24px; text-align: center; color: var(--dim); }
  label { display: grid; gap: 6px; margin-bottom: 14px; color: var(--dim); font-size: 14px; }
  input { width: 100%; min-height: 50px; padding: 0 14px; border: 1px solid #ffffff1a; border-radius: 14px; background: var(--elev); color: #f1f1f3; font: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  .pw { position: relative; }
  .pw input { padding-right: 52px; }
  .eye { position: absolute; top: 50%; right: 6px; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: none; border-radius: 50%; background: none; color: var(--dim); transform: translateY(-50%); cursor: pointer; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; margin-top: 8px; border: none; border-radius: 14px; background: var(--accent); color: #1a1300; font: inherit; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: 0.5; }
  .msg { min-height: 24px; margin: 14px 0 0; text-align: center; color: var(--err); }
  .done { margin-top: 22px; text-align: center; font-size: 18px; font-weight: 700; color: var(--ok); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a.5.5 0 0 0 .8.4l11.5-7.5a.5.5 0 0 0 0-.8L7.8 4.1a.5.5 0 0 0-.8.4z"/></svg></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub" data-i18n="intro"></p>

  <form id="form">
    <label><span data-i18n="url"></span><input id="url" type="url" inputmode="url" placeholder="http://192.168.1.10:8096" autocomplete="url" autocapitalize="off" spellcheck="false" required /></label>
    <label><span data-i18n="username"></span><input id="username" autocomplete="username" autocapitalize="off" spellcheck="false" /></label>
    <label><span data-i18n="password"></span>
      <span class="pw">
        <input id="password" type="password" autocomplete="current-password" />
        <button class="eye" id="eye" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="eye-path" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg></button>
      </span>
    </label>
    <button class="btn" id="send" type="submit" data-i18n="send"></button>
    <p class="msg" id="msg"></p>
  </form>
  <p class="done" id="done" hidden data-i18n="done"></p>
</main>
<script>const L = /*I18N*/{}; const SERVER = "/*SERVER*/"; const URL_HINT = "/*URL*/";</script>
<script>
  const base = location.pathname.replace(/\/$/, "");
  const $ = (id) => document.getElementById(id);
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = L[el.dataset.i18n] || ""));
  $("title").textContent = (L.title || "").replace("{server}", SERVER);
  if (URL_HINT) $("url").value = URL_HINT;

  // Œil : afficher le mot de passe en clair, ou le masquer.
  const EYE = "M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z";
  const EYE_OFF = "M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c7 0 11 7 11 7a18 18 0 0 1-3.2 4M6.6 6.6A18 18 0 0 0 1 12s4 7 11 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2";
  const eye = () => {
    const shown = $("password").type === "text";
    $("eye").setAttribute("aria-label", shown ? L.hidePassword : L.showPassword);
    $("eye-path").setAttribute("d", shown ? EYE_OFF : EYE);
  };
  $("eye").addEventListener("click", () => {
    $("password").type = $("password").type === "password" ? "text" : "password";
    eye();
  });
  eye();

  // La télé se connecte, puis publie le résultat (voir Login.svelte) : on le suit.
  async function poll() {
    try {
      const s = await (await fetch(base + "/status", { cache: "no-store" })).json();
      if (s.step === "done") {
        $("form").hidden = true;
        $("sub").hidden = true;
        $("done").hidden = false;
        return;
      }
      if (s.step === "error") {
        $("msg").textContent = s.error || L.failed;
        $("send").disabled = false;
        $("send").textContent = L.send;
        return;
      }
    } catch {
      // La télé a peut-être fermé l'écran : on réessaie quand même.
    }
    setTimeout(poll, 1000);
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("msg").textContent = "";
    $("send").disabled = true;
    $("send").textContent = L.connecting;
    try {
      const body = JSON.stringify({ url: $("url").value.trim(), username: $("username").value.trim(), password: $("password").value });
      const r = await fetch(base + "/login", { method: "POST", headers: { "Content-Type": "application/json" }, body });
      if (!r.ok) throw new Error(L.tvGone);
      poll();
    } catch (err) {
      $("msg").textContent = err.message;
      $("send").disabled = false;
      $("send").textContent = L.send;
    }
  });
</script>
</body>
</html>
